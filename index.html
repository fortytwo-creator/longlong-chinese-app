<body>
  <div class="app">
    <header id="top">
      <div class="who"><span class="avatar" id="hAvatar">🐉</span><b id="hName">Ciao!</b></div>
      <div class="pills">
        <span class="pill" title="Giorni di fila">🔥 <b id="hStreak">0</b></span>
        <span class="pill" title="XP">⭐ <b id="hXp">0</b></span>
        <span class="pill" title="Monete">🪙 <b id="hCoins">0</b></span>
      </div>
    </header>

    <main id="view"></main>

    <nav id="nav">
      <button data-act="nav" data-id="home"><span>🏠</span>Home</button>
      <button data-act="nav" data-id="course"><span>🐉</span>Corso</button>
      <button data-act="nav" data-id="arcade"><span>🥋</span>Dojo</button>
      <button data-act="nav" data-id="stats"><span>📊</span>Stats</button>
      <button data-act="nav" data-id="profile"><span>👤</span>Profilo</button>
    </nav>
  </div>

  <div id="sheet" hidden>
    <div class="s-top">
      <button class="s-close" data-act="close" aria-label="Chiudi">✕</button>
      <div class="s-bar"><i id="sProg"></i></div>
      <b id="sTitle"></b>
    </div>
    <div id="sBody"></div>
  </div>
  <div id="toast" role="status"></div>

  <script src="lib/hanzi-writer.min.js"></script>
  <script src="config.js"></script>

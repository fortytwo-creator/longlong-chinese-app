# Codemagic: compila l'app 龙龙中文 per iPhone e Android partendo dal repository.
# Prima di tutto lancia "ios-prova" (non serve l'account Apple Developer): dice se il codice Swift compila.
# Variabili facoltative (Codemagic → Environment variables):
#   PRODUCT_ID      (facoltativa) identificativo dell'acquisto negli store; se manca vale it.longlong.chinese.premium
# Nessun altro segreto: l'app è senza server (niente account, tutto l'audio dentro, acquisto dagli store).
# Il repository deve avere la cartella audio/ con TUTTO l'audio (se hai anche audio-premium/, viene unito da solo).

definitions:
  env_native: &env_native
    node: 20
    xcode: latest
    cocoapods: default
  prepara_nativo: &prepara_nativo
    name: Prepara l'app (npm, pagine, piattaforma)
    script: |
      set -e
      cd native
      npm install
      npm run www

workflows:
  ios-prova:
    name: iPhone - prova di compilazione (senza firma)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment: *env_native
    scripts:
      - *prepara_nativo
      - name: Aggiungi iOS e permessi
        script: |
          set -e
          cd native
          npx cap add ios
          npx cap sync ios
          node scripts/prepare-platforms.cjs
      - name: Compila per il simulatore
        script: |
          set -e
          cd native/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty
    artifacts:
      - native/ios/App/build/**/*.app

  ios-testflight:
    name: iPhone - TestFlight (serve l'account Apple Developer)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: lovetemasu-asc
    environment:
      <<: *env_native
      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.longlong.chinese
      vars:
        APP_STORE_APPLE_ID: "6821333371"      # ID numerico dell app in App Store Connect (è nell indirizzo della pagina: /apps/<numero>/)
    scripts:
      - *prepara_nativo
      - name: Aggiungi iOS e permessi
        script: |
          set -e
          cd native
          npx cap add ios
          npx cap sync ios
          node scripts/prepare-platforms.cjs
      - name: Firma e numero di versione
        script: |
          set -e
          cd native/ios/App
          xcode-project use-profiles
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Crea il file .ipa
        script: |
          set -e
          cd native/ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    artifacts:
      - native/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-prova:
    name: Android - APK di prova
    instance_type: linux_x2
    max_build_duration: 40
    environment:
      node: 20
      java: 17
    scripts:
      - *prepara_nativo
      - name: Aggiungi Android e permessi
        script: |
          set -e
          cd native
          npx cap add android
          npx cap sync android
          node scripts/prepare-platforms.cjs
      - name: Compila l'APK
        script: |
          set -e
          cd native/android
          ./gradlew assembleDebug
    artifacts:
      - native/android/app/build/outputs/**/*.apk

  android-apk:
    name: Android - APK firmato (da installare a mano)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 20
      java: 17
      android_signing:
        - longlong_keystore          # nome dato alla chiave in Codemagic → Code signing identities → Android keystores
      vars:
        NOSTORE: "1"                 # APK fuori da Google Play: niente acquisto, il piano completo si sblocca con i codici
    scripts:
      - *prepara_nativo
      - name: Aggiungi Android, permessi, firma e numero di versione
        script: |
          set -e
          cd native
          npx cap add android
          npx cap sync android
          node scripts/prepare-platforms.cjs
      - name: Compila l'APK firmato
        script: |
          set -e
          cd native/android
          ./gradlew assembleRelease
    artifacts:
      - native/android/app/build/outputs/**/*.apk
